name: Check site and queue
on: [push, pull_request, workflow_dispatch]
jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
        env:
          MONGOMS_DISABLE_POSTINSTALL: "1"
      - run: npm run build
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: yehry3-site
          path: dist
